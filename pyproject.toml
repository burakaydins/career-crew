[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-crew"
version = "0.1.0"
description = "Multi-agent job application assistant: tailored CV, cover letter and interview prep with anti-fabrication checks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Burak Aydın" }]
dependencies = ["rich>=13", "pypdf>=5", "python-docx>=1.1", "fastapi>=0.110", "uvicorn>=0.30", "python-multipart>=0.0.9", "fpdf2>=2.8"]

[project.optional-dependencies]
api = ["anthropic>=0.70"]
dev = ["pytest>=8", "pillow>=10", "httpx>=0.27", "setuptools>=68"]

[project.scripts]
career-crew = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["assets/fonts/*", "agents/*.json", "prompts/*/*.md"]
"app.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real model (set CAREER_CREW_LIVE=1)"]
